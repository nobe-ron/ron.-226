<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ron. - Brand Website</title>

  <!-- フォント・CSS読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Scope+One&family=Cormorant+Garamond&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Swiper CSS -->
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
/>
</head>
<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

<script>
  const swiper = new Swiper(".swiper-container", {
    loop: true,
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
    spaceBetween: 30,
  });
</script>
<body>
  <!-- Intro Animation -->
  <div class="intro-grid">
    <div class="logo">Ron.</div>
  </div>

  <!-- Main Content -->
  <div class="main-content" style="display: none;">
    <div class="content">
      <header>
        <div class="swiper-container"></div>
        <nav>
          <ul>
            <li><a href="#about">About</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </nav>
      </header>

      <section id="about">
        <h2>About</h2>
        <p>Ron. is a brand that pursues refined design and everyday comfort.</p>
      </section>

      <section id="products">
        <h2>Products</h2>
        <div class="swiper-container">
            <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="images/work1-1.jpg" alt="Work 1"></div>
            <div class="swiper-slide"><img src="images/work2-1.jpg" alt="Work 2"></div>
            <div class="swiper-slide"><img src="images/work3-1.jpg" alt="Work 3"></div>
            <div class="swiper-slide"><img src="images/work4-1.jpg" alt="Work 4"></div>
        </div>

            <!-- ナビゲーションボタン -->
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>

            <!-- ページネーション（ドット） -->
            <div class="swiper-pagination"></div>
        </div>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <form id="contact-form">
          <input type="text" name="name" placeholder="Name" required />
          <input type="email" name="email" placeholder="Email" required />
          <textarea name="message" placeholder="Message" required></textarea>
          <button type="submit">SEND</button>
        </form>
      </section>

      <footer>
        <p>&copy; 2025 Ron. All rights reserved.</p>
      </footer>
    </div>
  </div>

  <!-- JS読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
  <script src="js/scripts.js"></script>
  <!-- EmailJSのSDKを読み込む -->
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
  // 初期化（公開鍵はダッシュボードの "Public Key" を使う）
  (function() {
    emailjs.init("iYdqzbVDg3-MH6Y7u"); // ←ここを差し替え
  })();

  // 送信イベント
  document.getElementById("contact-form").addEventListener("submit", function(event) {
    event.preventDefault();

    emailjs.sendForm("service_wavptq4", "template_ghggrh5", this)
      .then(() => {
        alert("Message sent successfully!");
        this.reset();
      }, (error) => {
        alert("Failed to send: " + JSON.stringify(error));
      });
  });
</script>
</body>
</html>
